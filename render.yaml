databases:
  - name: primegym-db
    databaseName: primegym
    user: primegym

services:
  - type: web
    name: primegym-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn primegym.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/auth/csrf/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: primegym-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: primegym-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://your-project.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-project.vercel.app
